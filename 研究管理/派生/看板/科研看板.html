  font-family: var(--font-ui);

}

.rtr-code {

  font-size: 12px;
  font-weight: 500;
  letter-spacing: .04em;
}

/* Focus visibility */
.rtr-root :is(button, a, input, textarea, summary, select, [tabindex="0"]):focus-visible,
.rtr-sheet :is(button, a, summary):focus-visible,
.rtr-ex :is(button, a, summary, [tabindex="0"]):focus-visible,

.rtr-btn-ghost,

}

.rtr-root .primary:hover {

}

.rtr-btn-ghost,
.rtr-root .ghost,
.rtr-ex .ghost,

.rtr-mk {

  align-items: center;
  gap: 6px;
  border: 1px solid var(--control-line);
  border-radius: var(--radius-pill);
  padding: 3px 10px 3px 6px;
  background: var(--surface-raised);
  color: var(--ink);
  font: 600 13px/18px var(--font-ui);
  white-space: nowrap;
}

.rtr-mk svg {
  width: 16px;
  height: 16px;
  flex: none;
}

.rtr-mk svg * {
  fill: var(--fam);
}

  letter-spacing: .04em;
  color: var(--fam);
}

.rtr-shelf-code {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px 2px 6px;
  border-radius: var(--radius-pill);
  background: var(--fam);
  color: var(--on-fam);
  font: 500 12px/1.4 var(--font-mono);
  letter-spacing: .04em;
}

.rtr-shelf-code::before {
  content: "";
  width: 9px;
  height: 9px;
  background: var(--on-fam);
  border-radius: 50%;
}

[data-family="company"] .rtr-shelf-code::before,
.rtr-shelf-code.is-company::before {
  border-radius: 1px;
}

/* ---------- SectionHeader (LessonHeader) ---------- */
.rtr-lh {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface-raised);
  color: var(--ink);
  font-family: var(--font-ui);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-control);
  padding: 0 16px 16px;
  overflow: hidden;
}

.rtr-lh-band {
  height: 6px;
  margin: 0 -16px;
  background: var(--fam);
}

.rtr-lh-top {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  align-items: center;
}

.rtr-lh-step {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--fam);
  color: var(--on-fam);
  font: 500 13px/1 var(--font-mono);
}

[data-family="company"] .rtr-lh-step,
.rtr-lh.is-company .rtr-lh-step {
  border-radius: var(--radius-sheet);
}

.rtr-lh-title {
  margin: 0;
  font: 700 clamp(20px, 3vw, 24px)/1.28 var(--font-ui);
  letter-spacing: -.015em;
  text-wrap: balance;
}

.rtr-lh-dl {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 5px 12px;
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
}

.rtr-lh-dl dt {
  font: 600 12px/1.6 var(--font-mono);
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--fam);
}

.rtr-lh-dl dd {
  margin: 0;
}

/* ---------- FigureStrip (Macro module) ---------- */
.rtr-fs-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.rtr-fs {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 14px 18px;
  align-items: center;
  background: var(--macro-tint);
  color: var(--ink);
  font-family: var(--font-ui);
  border-radius: var(--radius-control);
  padding: 12px 16px;
}

.rtr-fs-num {
  font: 500 clamp(28px, 4vw, 40px)/1.1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--macro);
  white-space: nowrap;
}

.rtr-fs-meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 14px;
  line-height: 1.45;
  min-width: 0;
}

.rtr-fs-k {
  display: inline-block;
  min-width: 56px;
  margin-right: 6px;
  font: 500 11px/1.4 var(--font-mono);
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.rtr-fs-pill {
  display: inline-block;
  border: 1px solid var(--macro);
  color: var(--macro);
  border-radius: var(--radius-pill);
  padding: 0 8px;
  font: 500 12px/1.6 var(--font-mono);
}

@media (max-width: 480px) {
  .rtr-fs {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
}

  color: var(--ink);
  font-family: var(--font-ui);

  gap: 8px 10px;

}

}

.rtr-vs-ev {
  border: 1px solid var(--company);
  color: var(--company);
  border-radius: var(--radius-sheet);
  padding: 0 8px;
  font: 500 12px/1.7 var(--font-mono);
  text-transform: uppercase;

  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

  gap: 6px;
  align-items: center;

  border-radius: var(--radius-pill);
  padding: 2px 10px;

  color: var(--ink-muted);
}

  border-style: dashed;
  color: var(--ink-muted);
}

.ex-explain .ex-none {

.ex-plot {

.ex-svg {

.ex-svg .ex-unit,

.ex-svg .ex-unit,

.ex-svg .ex-pct {

.ex-bar.is-light {

  stroke-width: 1.5;
}

.ex-bar.is-dark {

}

.ex-axis {
  stroke: var(--ink);
  stroke-width: 1;
}

.ex-ref {
  stroke: var(--control-line);
  stroke-width: 2;

}

.ex-pl {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.ex-dot {
  fill: var(--ink);
  stroke: var(--surface-raised);
  stroke-width: 2;
}

.ex-svg .ex-pl,
.ex-svg .ex-dot,
.ex-svg .ex-pct,
.ex-svg .ex-ref,
.ex-svg .ex-ref-lab,
.ex-svg .ex-unit,
.ex-svg .ex-axis {

}

.ex-colbg {
  fill: transparent;
}

.ex-col.is-sel .ex-colbg {

}

.ex-col.is-evidence .ex-colbg {
  fill: var(--fam-tint);
  stroke: var(--fam);
  stroke-width: 2;
}

.ex-col.is-focus .ex-colbg {
  stroke: var(--focus);
  stroke-width: 2.5;
}

.ex-hit {
  fill: transparent;
  cursor: pointer;
  outline: none;
}

@media (hover: hover) and (pointer: fine) {
  .ex-col:not(.is-sel):not(.is-evidence):hover .ex-colbg {
    fill: var(--surface);

}

/* Narrow-screen horizontal rows for bar-line */
.ex-rows {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.ex-rows-head,
.ex-row {
  display: grid;
  grid-template-columns: minmax(0, 29%) minmax(0, 1fr) 100px;
  column-gap: 10px;
  align-items: center;
}

.ex-row.no-rate {
  grid-template-columns: minmax(0, 32%) minmax(0, 1fr);
}

.ex-rows-head {
  padding: 0 8px 2px;
  font: 500 12px/1.4 var(--font-mono);
  color: var(--ink-muted);
}

.ex-row {
  width: 100%;
  min-height: 50px;
  padding: 6px 8px;
  border: 0;
  border-radius: var(--radius-control);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.ex-row[aria-pressed="true"] {
  background: var(--fam-tint);
}

.ex-row.is-evidence {
  background: var(--fam-tint);
  box-shadow: inset 3px 0 0 var(--fam);
}

@media (hover: hover) and (pointer: fine) {
  .ex-row:not([aria-pressed="true"]):not(.is-evidence):hover {
    background: var(--surface);
  }
}

.ex-row-name {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.ex-row-bars {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.ex-hline {
  position: relative;
  display: block;
  height: 18px;
}

.ex-hbar {
  position: absolute;
  left: 0;
  top: 4px;
  height: 11px;
  width: max(2px, calc((100% - 40px) * var(--k)));

}

.ex-hbar.is-light {
  background: var(--fam-tint);
  box-shadow: inset 0 0 0 1.5px var(--fam);
}

.ex-hbar.is-dark {
  background: var(--fam);
}

.ex-hval {
  position: absolute;
  top: -1px;
  left: calc((100% - 40px) * var(--k) + 6px);
  font: 500 13px/1.45 var(--font-mono);
  white-space: nowrap;
}

.ex-hval.is-light {
  color: var(--ink-muted);
}

.ex-hval.is-dark {
  color: var(--fam);
}

.ex-row-rate {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.ex-track {
  position: relative;
  flex: 1;
  min-width: 30px;
  height: 18px;
  border-bottom: 1px solid var(--hairline);
}

.ex-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(100% * var(--x));
  border-left: 2px dashed var(--control-line);
}

.ex-pt {
  position: absolute;
  top: 50%;
  left: calc(100% * var(--x));
  width: 10px;
  height: 10px;
  margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: var(--ink);
  box-shadow: 0 0 0 2px var(--surface-raised);
}

.ex-rval {
  min-width: 34px;
  font: 700 13px/1 var(--font-mono);
  text-align: right;
}

/* Table view */
.ex-table {
  font-size: 14px;
}

table.ex-table caption {
  padding-bottom: 8px;
  font: 600 13px/1.45 var(--font-ui);
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink);
}

.ex-table th,
.ex-table td {
  white-space: normal;
  vertical-align: middle;
}

.ex-table tbody tr.is-sel th,
.ex-table tbody tr.is-sel td {
  background: var(--surface);
}

.ex-table tbody tr.is-evidence th,
.ex-table tbody tr.is-evidence td {
  background: var(--fam-tint);
}

.ex-table tbody tr.is-evidence th {
  box-shadow: inset 3px 0 0 var(--fam);
}

.ex-table tfoot th,
.ex-table tfoot td {
  border-top: 1px solid var(--ink);
  border-bottom: 0;
  font-weight: 600;
}

.ex-table tfoot th {
  font-weight: 500;
  color: var(--ink-muted);
}

.ex-cat {
  padding: 4px 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-weight: 600;
  text-align: left;
  text-decoration: underline dotted var(--fam);
  text-underline-offset: 4px;
  cursor: pointer;
}

.ex-cat[aria-pressed="true"] {
  color: var(--fam);
}

.ex-vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

table.ex-table th {
  position: relative;
}

.ex-th-short {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
}

.ex-refline {
  margin: 8px 0 0;
  font: 13px/1.5 var(--font-mono);
  color: var(--ink-muted);
}

/* C-014b printed tables */
table.ex-tbl {
  font-size: 14px;
}

table.ex-tbl th,
table.ex-tbl td {
  white-space: normal;
  overflow-wrap: normal;
  vertical-align: bottom;
}

table.ex-tbl td {
  white-space: nowrap;
  font-family: var(--font-mono);
}

table.ex-tbl tbody th,
table.ex-tbl tbody td,
table.ex-tbl tfoot th,
table.ex-tbl tfoot td {
  vertical-align: baseline;
}

.ex-tbl tbody .ex-cat,
.ex-tbl tfoot .ex-cat {
  white-space: nowrap;
}

.ex-tbl .ex-rl {
  font-weight: 500;
  color: var(--ink-muted);
}

.ex-tbl thead tr:first-child th.ex-per {
  border-bottom-color: var(--hairline);

  font: 600 13px/1.4 var(--font-mono);
  white-space: nowrap;
}

.ex-tbl thead tr + tr th:first-child {

}

.ex-tbl .ex-g0 {

}

.ex-colbtn {

  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-weight: 600;
  text-align: right;
  text-decoration: underline dotted var(--fam);
  text-underline-offset: 4px;

}

.ex-colbtn[aria-pressed="true"] {

}

.ex-tbl .is-col,
.ex-mini tr.is-col > * {

}

.ex-tbl td.is-col .ex-num,
.ex-tbl td.is-col .ex-u,
.ex-mini tr.is-col .ex-num,
.ex-mini tr.is-col .ex-u {

}

.ex-tbl tbody tr.is-sel td.is-col {

}

.ex-tbl tfoot tr.is-printed th {

  font-weight: 600;
}

.ex-tbl tbody tr:last-child > th,
.ex-tbl tbody tr:last-child > td {

}

.ex-tbl tfoot tr.is-printed th,
.ex-tbl tfoot tr.is-printed td {

}

.ex-tbl tfoot tr.is-ours th,
.ex-tbl tfoot tr.is-ours td {
  border-top: 1px dashed var(--ink-muted);
}

.ex-tbl tfoot tr.is-sel th,
.ex-tbl tfoot tr.is-sel td {
  background: var(--surface);
}

.ex-tot {
  font-weight: 500;
}

.ex-total.is-printed .ex-tot {
  font-weight: 600;
}

.ex-delta {
  display: none;
  margin-top: 2px;
  font: 500 12.5px/1.3 var(--font-mono);
  color: var(--fam);
  white-space: nowrap;
}

.ex.is-chg .ex-delta {

}

.ex-chg-note {

  line-height: 1.5;
  color: var(--ink-muted);
}

.ex.is-chg .ex-chg-note {
  display: block;
}

/* Narrow-screen cards for printed tables */
.ex-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ex-cards-head {
  margin: 0;
  font: 500 13px/1.4 var(--font-mono);
  color: var(--ink-muted);
}

.ex-card {
  padding: 4px 10px 6px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-control);
  background: var(--surface-raised);
}

.ex-card.is-sel {
  border-color: var(--fam);

.ex-card.is-evidence {

.ex-card-name {

.ex-mini {

}

.ex-mini th,
.ex-mini td {

  border-top: 1px solid var(--hairline);
  text-align: right;
  vertical-align: top;
}

.ex-mini thead th {
  border-top: 0;
  vertical-align: middle;
  font: 600 13px/1.4 var(--font-mono);
  color: var(--ink-muted);
  white-space: nowrap;
}

.ex-mini thead th.ex-mini-name {
  padding-left: 0;
  text-align: left;
  white-space: normal;

}

.ex-mini tbody th {
  text-align: left;
  font-weight: 500;
}

.ex-mini td {
  font-family: var(--font-mono);
}

.ex-mini tbody td {
  width: 24%;
}

.ex-mlab {
  border-radius: 3px;
}

.ex[data-focus] .ex-plot [data-part] {

}

.ex[data-focus="key"] .ex-tbl td,
.ex[data-focus="key"] .ex-tbl tbody th,
.ex[data-focus="key"] .ex-tbl tfoot th,

.ex[data-focus="key"] .ex-card-name {

}

.ex-u {

.ex[data-focus="units"] .ex-u {

}

.ex[data-focus="units"] .ex-colbtn {

}

.ex[data-focus="units"] .ex-u.is-slip {
  text-decoration: underline wavy var(--fam) 1.5px;
  text-underline-offset: 4px;
  text-decoration-skip-ink: none;
}

/* C-014c waterfalls */
.ex-wbar.is-total {
  fill: var(--fam);
}

.ex-wbar.is-down {
  fill: var(--fam-tint);
  stroke: var(--fam);
  stroke-width: 1.5;
}

.ex-wbar.is-up {
  fill: var(--surface-raised);
  stroke: var(--fam);
  stroke-width: 1.5;
}

.ex-svg .ex-wval.is-in {
  fill: var(--ink);
}

.ex-svg .ex-wval.is-in.is-total {
  fill: var(--on-fam);
}

.ex-conn {
  stroke: var(--control-line);
  stroke-width: 1;
}

.ex-svg .ex-conn,
.ex-svg .ex-xlabs,
.ex-svg .ex-left,
.ex-svg .ex-wbar,
.ex-svg .ex-wval {

}

.ex-svg .ex-left {

  fill: var(--fam);
}

.ex.is-left .ex-svg .ex-left {

}

.ex-wrows .ex-rows-head,
.ex-wrow {
  grid-template-columns: minmax(0, 34%) minmax(0, 1fr) 100px;
}

.ex-wtrack {
  position: relative;
  display: block;
  height: 16px;
  border-bottom: 1px solid var(--hairline);
}

.ex-wseg {
  position: absolute;
  top: 3px;
  height: 11px;

  width: max(2px, calc(100% * (var(--b) - var(--a))));
  border-radius: 2px;
}

.ex-wseg.is-total {
  background: var(--fam);
}

.ex-wseg.is-down {
  background: var(--fam-tint);
  box-shadow: inset 0 0 0 1.5px var(--fam);
}

.ex-wseg.is-up {
  background: var(--surface-raised);
  box-shadow: inset 0 0 0 1.5px var(--fam);
}

.ex-wv {

  text-align: right;

.ex-wv .ex-left {

.ex.is-left .ex-wv .ex-left {

.ex-tools .ex-left-btn {

.ex-wtable .ex-ours {

}

.ex[data-focus="key"] .ex-xlabs text,
.ex-xlabs.is-evidence text {

}

.ex[data-focus="key"] .ex-wbar,
.ex[data-focus="key"] .ex-wval,
.ex[data-focus="key"] .ex-conn,
.ex[data-focus="key"] .ex-wtrack,
.ex[data-focus="key"] .ex-wv {

/* Readout & Find-it strip */
.ex-tools {
  margin-top: 10px;

  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px 14px;
}

.ex-read {

  min-height: 44px;
  font-size: 14px;
  line-height: 1.5;
}

.ex-read p {

}

.ex-read-hint {

}

.ex-read-vals {

.ex-read-vals b {

.ex-read .ex-check {

.ex-note,

.ex-src {

.ex > details.zh {
  margin-top: 10px;

.ex[data-focus] [data-part],
.ex[data-focus] .ex-plot,
.ex[data-focus] .ex-tools,
.ex[data-focus] .ex-find {

.ex[data-focus="title"] [data-part="title"],

    const label = p[0] === "key" && isTable ? "Columns" : p[0] === "key" && isFall ? "Steps" : p[1];
    const b = el("button", { class: "chip ex-chip", type: "button", "data-for": p[0], "aria-pressed": "false" });
    add(b, el("span", { class: "ex-chip-n", "aria-hidden": "true" }, String(i + 1)), document.createTextNode(label));
    b.addEventListener("click", () => setFocus(p[0]));
    chips.appendChild(b);
  });
  add(frame, flabel, chips, explain);

  function printedText(part) {
    if (part === "title") return `${String(ex.number).toUpperCase()}: ${ex.title}`;
    if (part === "units") return `(${ex.units})`;
    if (part === "key" && isFall) return cats.join(" · ");
    if (part === "note" && !ex.note) return null;
    if (part === "key" && isTable) {
      return [ex.row_label, periods.join(" · "), cols.map((c) => c.label).join(" · ")]
        .concat(ex.total ? [ex.total.label] : [])
        .join(" | ");
    }
    if (part === "key") {
      return ex.series.map((s) => s.label).concat(refs.map((r) => r.label)).join(" · ");
    }
    if (part === "note") return ex.note;
    return `Source: ${ex.source}`;
  }

  function setFocus(part) {
    st.focus = st.focus === part ? null : part;
    if (st.focus) {
      st.seen[part] = true;
      fig.setAttribute("data-focus", part);
    } else {
      fig.removeAttribute("data-focus");
    }
    Array.from(chips.children).forEach((b) => {
      const f = b.getAttribute("data-for");
      b.setAttribute("aria-pressed", String(f === st.focus));
      b.classList.toggle("is-seen", Boolean(st.seen[f]));
    });
    explain.innerHTML = "";
    explain.hidden = !st.focus;
    if (st.focus) {
      const pp = el("p", { class: "ex-printed" });
      const po = el("p", { class: "ex-ours" });
      const printed = printedText(part);
      add(
        pp,
        el("span", { class: "ex-tag" }, "As printed"),
        printed == null ? el("em", { class: "ex-none" }, "No note is printed under this exhibit.") : el("q", {}, printed)
      );
      add(po, el("span", { class: "ex-tag" }, "In plain words"), document.createTextNode((ex.frame && ex.frame[part]) || ""));
      add(explain, pp, po, ex.frame && ex.frame.zh && ex.frame.zh[part] ? createZh(ex.frame.zh[part]) : null);
    }
    const done = EX_PARTS.every((p) => st.seen[p[0]]);
    flabel.classList.toggle("is-done", done);
    flabel.textContent = done
      ? (isTable ? "Frame read. Now tap a row or a column." : isFall ? "Frame read. Now tap a step." : "Frame read. Now tap the bars.")
      : "Read the frame first";
  }

  const plot = el("div", { class: "ex-plot" });
  const tools = el("div", { class: "ex-tools" });
  const read = el("div", { class: "ex-read", "aria-live": "polite" });
  let vChart = null;
  let vTable = null;
  let vChg = null;
  let vLeft = null;
  let views = null;
  let chgNote = null;

  if (!isTable) {
    vChart = el("button", { class: "ghost ex-view", type: "button", "aria-pressed": "true" }, "Chart");
    vTable = el("button", { class: "ghost ex-view", type: "button", "aria-pressed": "false" }, "Table");
    views = el("div", { class: "ex-views", role: "group", "aria-label": "Show the exhibit as" });
    add(views, vChart, vTable);
    vChart.addEventListener("click", () => setView("chart"));
    vTable.addEventListener("click", () => setView("table"));
  } else if (periods.length > 1) {
    vChg = el("button", { class: "ghost ex-view", type: "button", "aria-pressed": "false" }, "Show change");
    views = el("div", { class: "ex-views", role: "group", "aria-label": "Change between periods" });
    views.appendChild(vChg);
    vChg.addEventListener("click", () => setChange(!st.change));
    chgNote = el(
      "p",
      { class: "ex-chg-note" },
      periods.length === 2
        ? `Small figures under ${periods[1]}: the change from ${periods[0]}, our arithmetic. pp = percentage points.`
        : "Small figures: the change from the period before, our arithmetic. pp = percentage points."
    );
  }

  if (isFall) {
    vLeft = el("button", { class: "ghost ex-left-btn", type: "button", "aria-pressed": "false" }, "Show what is left");
    vLeft.addEventListener("click", () => setLeft(!st.left));
    chgNote = el("p", { class: "ex-chg-note ex-left-note" }, "Small figures under each cut: what is left after it, our sums.");
  }

  add(tools, read, views, vLeft);
  const findBox = Array.isArray(ex.find) && ex.find.length ? el("div", { class: "ex-find" }) : null;
  const findFb = el("p", { class: "ex-find-fb", "aria-live": "polite" });
  const note = ex.note ? el("p", { class: "ex-note", "data-part": "note", id: pid("note") }, ex.note) : null;
  const source = el("p", { class: "ex-src", "data-part": "source", id: pid("source") }, `Source: ${ex.source}`);
  add(fig, band, head, key, frame, plot, chgNote, tools, findBox, note, source, ex.zh ? createZh(ex.zh) : null);

  function showRead(i) {
    read.innerHTML = "";
    if (i == null) {
      read.appendChild(
        el(
          "p",
          { class: "ex-read-hint" },
          st.layout === "table" ? "Tap a name to pick its row." : st.layout === "rows" ? "Tap a row to read its numbers." : "Tap a bar to read its numbers."
        )
      );
      return;
    }
    const vals = el("p", { class: "ex-read-vals" });
    vals.appendChild(el("b", {}, cats[i]));
    ex.series.forEach((s) => {
      vals.appendChild(el("span", {}, `${s.label} ${formatSeriesValue(s, s.values[i])}`));
    });
    read.appendChild(vals);
    if (line && Array.isArray(line.ratio) && byKey(line.ratio[0]) && byKey(line.ratio[1])) {
      const a = byKey(line.ratio[0]).values[i];
      const b = byKey(line.ratio[1]).values[i];
      if (b) {
        const c = Math.round((a / b) * 100);
        read.appendChild(
          el(
            "p",
            { class: "ex-check" },
            `Check: ${a} ÷ ${b} ≈ ${c}%${c === line.values[i] ? "." : `. The labels are rounded, so the printed ${line.values[i]}% can differ a little.`}`
          )
        );
      }
    }
  }

  function nodeFor(i) {
    return plot.querySelector(`[data-i="${i}"]`);
  }

  function markSel() {
    plot.querySelectorAll("[data-i]").forEach((nd) => {
      const on = Number(nd.getAttribute("data-i")) === st.sel;
      nd.classList.toggle("is-sel", on);
      const b = nd.matches("button") ? nd : nd.querySelector("button, .ex-hit");
      if (b) b.setAttribute("aria-pressed", String(on));
    });
  }

  function flash(i, cls) {
    const nd = nodeFor(i);
    if (!nd) return;
    nd.classList.remove("is-hit", "is-miss");
    void nd.getBoundingClientRect();
    nd.classList.add(cls);
    setTimeout(() => nd.classList.remove(cls), 900 * getSpeed());
  }

  function readNow() {
    if (isTable) tRead();
    else if (isFall) fallRead(st.sel);
    else showRead(st.sel);
  }

  function pick(i) {
    st.sel = i;
    st.last = "row";
    if (isTable) {
      st.tot = false;
      markTot();
    }
    markSel();
    readNow();
    if (!findBox || st.find >= ex.find.length || st.solved) return;
    const t = ex.find[st.find];
    if (cats[i] === t.target) {
      st.solved = true;
      findFb.setAttribute("data-ok", "true");
      findFb.textContent = t.right;
      flash(i, "is-hit");
      renderFind();
    } else {
      findFb.setAttribute("data-ok", "false");
      findFb.textContent = `That is ${cats[i]}. ${t.hint}`;
      flash(i, "is-miss");
    }
  }

  function resetFind(to) {
    st.find = to;
    st.solved = false;
    findFb.textContent = "";
    findFb.removeAttribute("data-ok");
    renderFind();
  }

  function renderFind() {
    if (!findBox) return;
    findBox.innerHTML = "";
    const total = ex.find.length;
    if (st.find >= total) {
      const again = el("button", { class: "ghost", type: "button" }, "Find them again");
      again.addEventListener("click", () => resetFind(0));
      add(findBox, el("span", { class: "ex-find-k" }, "Find it"), el("p", { class: "ex-find-done" }, `All ${total} found.`), again);
      return;
    }
    add(
      findBox,
      el("span", { class: "ex-find-k" }, `Find it · ${st.find + 1} of ${total}`),
      el("p", { class: "ex-find-ask" }, ex.find[st.find].ask),
      findFb
    );
    if (st.solved) {
      const nx = el("button", { class: "ghost", type: "button" }, st.find + 1 < total ? "Next" : "Done");
      nx.addEventListener("click", () => resetFind(st.find + 1));
      findBox.appendChild(nx);
    }
  }

  function applyEv() {
    fig.querySelectorAll(".is-evidence").forEach((nd) => nd.classList.remove("is-evidence"));
    st.ev.forEach((rawRef) => {
      const ref = String(rawRef).replace(/^ex\d+:/, "");
      const nd = document.getElementById(pid(ref));
      if (nd && fig.contains(nd)) nd.classList.add("is-evidence");
      fig.querySelectorAll(`[data-ev="${ref}"]`).forEach((x) => x.classList.add("is-evidence"));
    });
  }

  function setView(v) {
    if (isTable) return;
    st.view = v === "table" ? "table" : "chart";
    if (vChart) vChart.setAttribute("aria-pressed", String(st.view === "chart"));
    if (vTable) vTable.setAttribute("aria-pressed", String(st.view === "table"));
    draw(true);
  }

  function colPads() {
    const f = measureFont(14, 500, true, fig);
    return [
      Math.ceil(textWidth(bars[0].unit, f)) + 12,
      line ? Math.ceil(textWidth(line.unit, f)) + 12 : 10
    ];
  }

  function layoutFor(w) {
    const pd = colPads();
    const cw = (w - pd[0] - pd[1]) / n;
    const font = measureFont(14, 400, false, fig);
    const out = [];
    if (cw < 64) return null;
    for (let i = 0; i < n; i++) {
      const ls = wrapLabel(cats[i], cw - 8, font);
      if (!ls || ls.length > 2) return null;
      out.push(ls);
    }
    return out;
  }

  function keys(e, i, root) {
    const k = e.key;
    let to = null;
    if (k === "Enter" || k === " ") {
      e.preventDefault();
      pick(i);
      return;
    }
    if (k === "ArrowRight") to = Math.min(n - 1, i + 1);
    else if (k === "ArrowLeft") to = Math.max(0, i - 1);
    else if (k === "Home") to = 0;
    else if (k === "End") to = n - 1;
    if (to === null || to === i) return;
    e.preventDefault();
    const hits = root.querySelectorAll(".ex-hit");
    hits.forEach((h, j) => h.setAttribute("tabindex", j === to ? "0" : "-1"));
    hits[to].focus();
  }

  function drawColumns(w, lines) {
    const pd = colPads();
    const padL = pd[0];
    const padR = pd[1];
    const top = 36;
    const ph = 210;
    const base = top + ph;
    const nl = Math.max(...lines.map((x) => x.length));
    const hgt = base + 14 + nl * 18 + 4;
    const cw = (w - padL - padR) / n;
    const gw = Math.min(cw * 0.58, 72);
    const gap = 3;
    const bw = (gw - gap * (bars.length - 1)) / bars.length;
    const bAx = ex.axes && ex.axes.bar;
    const lAx = ex.axes && ex.axes.line;
    const bMax = bAx ? bAx[1] : niceMax(Math.max(...bars.reduce((a, s) => a.concat(s.values), [])) * 1.15);
    const lMin = lAx ? lAx[0] : 0;
    const lMax = lAx ? lAx[1] : 100;
    const mono = measureFont(14, 500, true, fig);

    const yB = (v) => base - (v / bMax) * ph;
    const yL = (p) => top + ((lMax - p) / (lMax - lMin)) * ph;

    const s = svgEl("svg", {
      class: "ex-svg",
      width: w,
      height: hgt,
      viewBox: `0 0 ${w} ${hgt}`,
      role: "group",
      "aria-label": `${ex.number}. Tap a column to read its numbers, or switch to Table.`
    });
    s.appendChild(svgEl("line", { class: "ex-axis", x1: padL, x2: w - padR, y1: base + 0.5, y2: base + 0.5 }));

    cats.forEach((_c, i) => {
      const cx = padL + cw * (i + 0.5);
      const x0 = cx - gw / 2;
      const dotY = line ? yL(line.values[i]) : null;
      const avoid = line ? [[cx - 22, dotY - 27, 44, 20], [cx - 7, dotY - 7, 14, 14]] : [];
      const g = svgEl("g", { class: "ex-col", "data-i": i, id: pid(slugs[i]) });
      g.appendChild(svgEl("rect", {
        class: "ex-colbg",
        x: (padL + cw * i + 3).toFixed(1),
        y: top - 30,
        width: (cw - 6).toFixed(1),
        height: ph + 33,
        rx: 6
      }));

      bars.forEach((sr, k) => {
        const v = sr.values[i];
        const bx = x0 + k * (bw + gap);
        const h = Math.max(base - yB(v), v > 0 ? 1 : 0);
        const t = tone(sr);
        g.appendChild(svgEl("rect", {
          class: `ex-bar is-${t}`,
          x: bx.toFixed(1),
          y: (base - h).toFixed(1),
          width: bw.toFixed(1),
          height: h.toFixed(1),
          style: `--i:${i}`
        }));
        const tw = textWidth(String(v), mono);
        const lx = bx + bw / 2;
        let ly = base - h - 6;
        const box = [lx - tw / 2, ly - 14, tw, 16];
        let inside = false;
        const hitsDot = avoid.some((a) => box[0] < a[0] + a[2] && box[0] + box[2] > a[0] && box[1] < a[1] + a[3] && box[1] + box[3] > a[1]);
        if (hitsDot && h >= 26) {
          ly = base - h + 17;
          inside = true;
        }
        g.appendChild(svgEl("text", {
          class: `ex-val is-${t}${inside ? " is-in" : ""}`,
          x: lx.toFixed(1),
          y: ly.toFixed(1),
          "text-anchor": "middle"
        }, String(v)));
      });

      const label = svgEl("text", { class: "ex-catlab", x: cx.toFixed(1), y: base + 22, "text-anchor": "middle" });
      lines[i].forEach((ln, j) => {
        label.appendChild(svgEl("tspan", { x: cx.toFixed(1), dy: j ? 18 : 0 }, ln));
      });
      g.appendChild(label);

      const hit = svgEl("rect", {
        class: "ex-hit",
        x: (padL + cw * i).toFixed(1),
        y: 0,
        width: cw.toFixed(1),
        height: hgt,
        role: "button",
        "aria-pressed": "false",
        "aria-label": ariaBarLine(i),
        tabindex: (st.sel == null ? i === 0 : i === st.sel) ? "0" : "-1"
      });
      hit.addEventListener("click", () => pick(i));
      hit.addEventListener("keydown", (e) => keys(e, i, s));
      hit.addEventListener("focus", () => g.classList.add("is-focus"));
      hit.addEventListener("blur", () => g.classList.remove("is-focus"));
      g.appendChild(hit);
      s.appendChild(g);
    });

    refs.forEach((r) => {
      const y = yL(r.value);
      const xa = padL + cw * 0.5 - gw / 2;
      const xb = padL + cw * (n - 0.5) + gw / 2;
      s.appendChild(svgEl("line", { class: "ex-ref", x1: xa.toFixed(1), x2: xb.toFixed(1), y1: y.toFixed(1), y2: y.toFixed(1) }));
      if (r.printed) {
        s.appendChild(svgEl("text", { class: "ex-ref-lab", x: xa.toFixed(1), y: (y + 18).toFixed(1) }, `${r.value}${r.unit}`));
      }
    });

    if (line) {
      const pts = line.values.map((v, i) => `${(padL + cw * (i + 0.5)).toFixed(1)},${yL(v).toFixed(1)}`).join(" ");
      s.appendChild(svgEl("polyline", { class: "ex-pl", pathLength: "1", points: pts }));
      line.values.forEach((v, i) => {
        const cx = padL + cw * (i + 0.5);
        const y = yL(v);
        s.appendChild(svgEl("circle", { class: "ex-dot", cx: cx.toFixed(1), cy: y.toFixed(1), r: 4.5, style: `--i:${i}` }));
        s.appendChild(svgEl("text", { class: "ex-pct", x: cx.toFixed(1), y: (y - 11).toFixed(1), "text-anchor": "middle" }, `${v}%`));
      });
    }

    add(
      s,
      svgEl("text", { class: "ex-unit", x: 2, y: 15 }, bars[0].unit),
      line ? svgEl("text", { class: "ex-unit", x: w - 2, y: 15, "text-anchor": "end" }, line.unit) : null
    );
    plot.appendChild(s);
  }

  function drawRows() {
    const box = el("div", { class: "ex-rows", role: "group", "aria-label": `${ex.number}. Tap a row to read its numbers.` });
    const headRow = el("div", { class: "ex-rows-head", "aria-hidden": "true" });
    add(headRow, el("span", {}, ex.category_label || ""), el("span", { class: "ex-unit" }, bars[0].unit), line ? el("span", { class: "ex-unit" }, line.unit) : null);
    box.appendChild(headRow);

    const bMax = Math.max(...bars.reduce((a, s) => a.concat(s.values), [])) || 1;
    cats.forEach((c, i) => {
      const b = el("button", {
        class: `ex-row${line ? "" : " no-rate"}`,
        type: "button",
        "data-i": i,
        id: pid(slugs[i]),
        "aria-pressed": "false",
        "aria-label": ariaBarLine(i)
      });
      const bx = el("span", { class: "ex-row-bars" });
      bars.forEach((sr) => {
        const hl = el("span", { class: "ex-hline" });
        hl.style.setProperty("--k", (sr.values[i] / bMax).toFixed(4));
        add(hl, el("span", { class: `ex-hbar is-${tone(sr)}` }), el("span", { class: `ex-hval is-${tone(sr)}` }, String(sr.values[i])));
        bx.appendChild(hl);
      });
      let rt = null;
      if (line) {
        rt = el("span", { class: "ex-row-rate" });
        const tr = el("span", { class: "ex-track" });
        refs.forEach((r) => {
          const m = el("span", { class: "ex-tick" });
          m.style.setProperty("--x", clamp01(r.value / 100).toFixed(4));
          tr.appendChild(m);
        });
        const dot = el("span", { class: "ex-pt" });
        dot.style.setProperty("--x", clamp01(line.values[i] / 100).toFixed(4));
        tr.appendChild(dot);
        add(rt, tr, el("span", { class: "ex-rval" }, `${line.values[i]}%`));
      }
      add(b, el("span", { class: "ex-row-name" }, c), bx, rt);
      b.addEventListener("click", () => pick(i));
      box.appendChild(b);
    });
    plot.appendChild(box);
  }

  function drawTable() {
    const t = el("table", { class: "changes ex-table" });
    const hr = el("tr");
    const th = el("thead");
    const tb = el("tbody");
    t.appendChild(el("caption", {}, `${ex.number}: ${ex.title} (${ex.units})`));
    hr.appendChild(el("th", { scope: "col" }, ex.category_label || ""));
    ex.series.forEach((sr) => {
      const thc = el("th", { scope: "col" });
      if (st.narrow) {
        const sh = el("span", { class: "ex-th-short", "aria-hidden": "true" });
        add(sh, el("span", { class: `ex-sw sw-${sr.mark === "bar" ? tone(sr) : "line"}` }), document.createTextNode(sr.unit));
        add(thc, el("span", { class: "ex-vh" }, sr.label), sh);
      } else {
        thc.textContent = sr.label;
      }
      hr.appendChild(thc);
    });
    th.appendChild(hr);
    t.appendChild(th);

    cats.forEach((c, i) => {
      const tr = el("tr", { "data-i": i, id: pid(slugs[i]) });
      const rh = el("th", { scope: "row" });
      const b = el("button", { class: "ex-cat", type: "button", "aria-pressed": "false" }, c);
      b.addEventListener("click", () => pick(i));
      rh.appendChild(b);
      tr.appendChild(rh);
      ex.series.forEach((sr) => {
        tr.appendChild(el("td", {}, sr.unit === "%" ? `${sr.values[i]}%` : String(sr.values[i])));
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb);

    if (ex.totals) {
      const fr = el("tr", { class: "ex-total" });
      const tf = el("tfoot");
      fr.appendChild(el("th", { scope: "row" }, "Total (our sum)"));
      ex.series.forEach((sr) => {
        let cell = "–";
        if (sr.mark === "bar") cell = String(sumValues(sr.values));
        else if (Array.isArray(sr.ratio) && byKey(sr.ratio[0]) && byKey(sr.ratio[1])) {
          cell = `${Math.round((sumValues(byKey(sr.ratio[0]).values) / sumValues(byKey(sr.ratio[1]).values)) * 100)}%`;
        }
        fr.appendChild(el("td", {}, cell));
      });
      tf.appendChild(fr);
      t.appendChild(tf);
    }

    plot.appendChild(t);
    refs.forEach((r) => {
      plot.appendChild(
        el(
          "p",
          { class: "ex-refline" },
          `${r.label}, dashed line: ${r.value}${r.unit}${r.printed ? "" : ` (not printed on this exhibit; ${exName(r.from)} gives it)`}`
        )
      );
    });
  }

  // C-014b printed tables
  const UNIT_WORD = /^(%|[A-Z]{1,4})$/;
  const tCol = (k) => cols.filter((c) => c.key === k)[0] || null;
  const tV = (p, k, i) => ex.values[p][k][i];
  const tFmt = (c, v) => (v == null ? "–" : c.unit === "%" ? `${v}%` : String(v));
  const tSigned = (d) => {
    const rounded = Math.round(d * 1000) / 1000;
    return rounded > 0 ? `+${rounded}` : rounded < 0 ? `−${Math.abs(rounded)}` : "0";
  };
  const tDelta = (c, a, b) => tSigned(b - a) + (c.unit === "%" ? " pp" : "");
  const tRatio = (c) => {
    const a = c && Array.isArray(c.ratio) ? tCol(c.ratio[0]) : null;
    const b = c && Array.isArray(c.ratio) ? tCol(c.ratio[1]) : null;
    return a && b ? [a, b] : null;
  };
  const tList = (xs) => (xs.length < 3 ? xs.join(" and ") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`);
  const hasTotal = () => Boolean(ex.total || ex.totals);
  const totName = () => (ex.total ? ex.total.label : "Total (our sum)");

  function tTotal(p, c) {
    if (ex.total) return ex.total.values[p][c.key];
    if (c.unit !== "%") return sumValues(ex.values[p][c.key]);
    const r = tRatio(c);
    const d = r ? sumValues(ex.values[p][r[1].key]) : 0;
    return d ? Math.round((sumValues(ex.values[p][r[0].key]) / d) * 100) : null;
  }

  function tLabel(c) {
    const words = String(c.label).split(" ");
    const last = words[words.length - 1];
    const frag = document.createDocumentFragment();
    if (words.length > 1 && UNIT_WORD.test(last)) {
      frag.appendChild(document.createTextNode(`${words.slice(0, -1).join(" ")} `));
      frag.appendChild(
        el("span", {
          class: `ex-u${last === c.unit ? "" : " is-slip"}`,
          "data-real": last === c.unit ? null : c.unit
        }, last)
      );
    } else {
      frag.appendChild(document.createTextNode(c.label));
    }
    return frag;
  }

  function tCell(j, c, v, prev, group) {
    const td = el("td", { "data-k": c.key, class: group ? "ex-g0" : null });
    if (v == null) {
      td.textContent = "–";
      return td;
    }
    td.appendChild(el("span", { class: "ex-num" }, String(v)));
    if (c.unit === "%") td.appendChild(el("span", { class: "ex-u" }, "%"));
    if (j > 0 && prev != null) td.appendChild(el("span", { class: "ex-delta" }, tDelta(c, prev, v)));
    return td;
  }

  function colButton(c) {
    const b = el("button", { class: "ex-colbtn", type: "button", "data-k": c.key, "aria-pressed": "false" });
    b.appendChild(tLabel(c));
    b.addEventListener("click", () => colTap(c.key));
    return b;
  }

  function totButton() {
    const b = el("button", { class: "ex-cat ex-tot", type: "button", "aria-pressed": "false" }, totName());
    b.addEventListener("click", totTap);
    return b;
  }

  function drawGrid() {
    const t = el("table", { class: "changes ex-table ex-tbl", "aria-labelledby": pid("title") });
    const th = el("thead", { "data-part": "key", "data-ev": "key", id: pid("key") });
    const r1 = el("tr");
    const r2 = el("tr");
    const tb = el("tbody");

    r1.appendChild(el("th", { scope: "col", rowspan: "2", class: "ex-rl" }, ex.row_label));
    periods.forEach((p) => {
      r1.appendChild(el("th", { scope: "colgroup", colspan: String(cols.length), class: "ex-per ex-g0" }, p));
    });
    periods.forEach(() => {
      cols.forEach((c, k) => {
        const h = el("th", { scope: "col", "data-k": c.key, class: k ? null : "ex-g0" });
        h.appendChild(colButton(c));
        r2.appendChild(h);
      });
    });
    add(th, r1, r2);
    t.appendChild(th);

    cats.forEach((name, i) => {
      const tr = el("tr", { "data-i": i, id: pid(slugs[i]), style: `--i:${i}` });
      const rh = el("th", { scope: "row" });
      const b = el("button", { class: "ex-cat", type: "button", "aria-pressed": "false" }, name);
      b.addEventListener("click", () => pick(i));
      rh.appendChild(b);
      tr.appendChild(rh);
      periods.forEach((p, j) => {
        cols.forEach((c, k) => {
          tr.appendChild(tCell(j, c, tV(p, c.key, i), j ? tV(periods[j - 1], c.key, i) : null, !k));
        });
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb);

    if (hasTotal()) {
      const tf = el("tfoot");
      const fr = el("tr", { class: `ex-total ${ex.total ? "is-printed" : "is-ours"}`, style: `--i:${n}` });
      const fh = el("th", { scope: "row" });
      fh.appendChild(totButton());
      fr.appendChild(fh);
      periods.forEach((p, j) => {
        cols.forEach((c, k) => {
          fr.appendChild(tCell(j, c, tTotal(p, c), j ? tTotal(periods[j - 1], c) : null, !k));
        });
      });
      tf.appendChild(fr);
      t.appendChild(tf);
    }

    plot.appendChild(t);
    return t;
  }

  function drawCards() {
    const box = el("div", { class: "ex-cards", role: "group", "aria-label": `${ex.number}. Tap a name to read its row.` });
    const hd = el("p", { class: "ex-cards-head" });
    hd.appendChild(el("span", { "data-part": "key", "data-ev": "key", id: pid("key") }, ex.row_label));
    box.appendChild(hd);

    function card(name, i, valueOf, cls) {
      const sec = el("section", { class: `ex-card${cls ? ` ${cls}` : ""}`, style: `--i:${i == null ? n : i}` });
      let nb;
      if (i == null) {
        nb = totButton();
      } else {
        sec.setAttribute("data-i", i);
        sec.id = pid(slugs[i]);
        nb = el("button", { class: "ex-cat", type: "button", "aria-pressed": "false" }, name);
        nb.addEventListener("click", () => pick(i));
      }
      nb.classList.add("ex-card-name");

      const mt = el("table", { class: "ex-mini" });
      const mh = el("thead");
      const hr = el("tr");
      const mb = el("tbody");
      const corner = el("th", { scope: "col", class: "ex-mini-name" });
      corner.appendChild(nb);
      hr.appendChild(corner);
      periods.forEach((p) => hr.appendChild(el("th", { scope: "col", "data-part": "key", "data-ev": "key" }, p)));
      mh.appendChild(hr);
      mt.appendChild(mh);

      cols.forEach((c) => {
        const tr = el("tr", { "data-k": c.key });
        const rh = el("th", { scope: "row" });
        const lab = el("span", { class: "ex-mlab", "data-part": "key", "data-ev": "key" });
        lab.appendChild(tLabel(c));
        rh.appendChild(lab);
        tr.appendChild(rh);
        periods.forEach((p, j) => {
          tr.appendChild(tCell(j, c, valueOf(p, c), j ? valueOf(periods[j - 1], c) : null, false));
        });
        mb.appendChild(tr);
      });
      mt.appendChild(mb);
      sec.appendChild(mt);
      return sec;
    }

    cats.forEach((name, i) => box.appendChild(card(name, i, (p, c) => tV(p, c.key, i))));
    if (hasTotal()) box.appendChild(card(null, null, tTotal, `ex-total ${ex.total ? "is-printed" : "is-ours"}`));
    plot.appendChild(box);
  }

  function markCol() {
    plot.querySelectorAll("[data-k]").forEach((nd) => {
      const on = nd.getAttribute("data-k") === st.col;
      if (nd.tagName === "BUTTON") nd.setAttribute("aria-pressed", String(on));
      else nd.classList.toggle("is-col", on);
    });
  }

  function markTot() {
    plot.querySelectorAll(".ex-total").forEach((nd) => nd.classList.toggle("is-sel", st.tot));
    plot.querySelectorAll(".ex-tot").forEach((b) => b.setAttribute("aria-pressed", String(st.tot)));
  }

  function lastRead() {
    return st.tot ? "tot" : st.col ? "col" : st.sel != null ? "row" : null;
  }

  function colTap(k) {
    st.col = st.col === k ? null : k;
    st.last = st.col ? "col" : lastRead();
    markCol();
    tRead();
  }

  function totTap() {
    st.tot = !st.tot;
    if (st.tot) {
      st.sel = null;
      markSel();
    }
    st.last = lastRead();
    markTot();
    tRead();
  }

  function setChange(on) {
    st.change = Boolean(on);
    if (vChg) vChg.setAttribute("aria-pressed", String(st.change));
    fig.classList.toggle("is-chg", st.change);
    tRead();
  }

  function drawPrinted(w, force) {
    if (!force && st.layout && w === st.width) return;
    st.width = w;
    st.narrow = w < 520;
    plot.innerHTML = "";
    let layout = "grid";
    const t = drawGrid();
    if (t.offsetWidth > w + 1) {
      plot.innerHTML = "";
      drawCards();
      layout = "cards";
    }
    st.layout = layout;
    plot.setAttribute("data-layout", layout);
    markSel();
    markCol();
    markTot();
    applyEv();
    tRead();
  }

  function tRead() {
    read.innerHTML = "";
    const mode = st.last === "row" && st.sel == null ? null : st.last;
    const vals = el("p", { class: "ex-read-vals" });
    if (!mode) {
      read.appendChild(
        el("p", { class: "ex-read-hint" }, st.layout === "cards" ? "Tap a name to read its row." : "Tap a name to read its row, or a column heading to read down it.")
      );
      return;
    }
    if (mode === "col") {
      const c = tCol(st.col);
      const r = tRatio(c);
      const many = periods.length > 1;
      let msg;
      vals.appendChild(el("b", {}, c.label));
      read.appendChild(vals);
      if (c.unit !== "%") {
        const sums = periods.map((p) => sumValues(ex.values[p][c.key]));
        msg = `Read down the column: the rows add up to ${tList(periods.map((p, j) => sums[j] + (many ? ` in ${p}` : "")))} (our ${many ? "sums" : "sum"}).`;
        if (ex.total) {
          const pr = periods.map((p) => ex.total.values[p][c.key]);
          msg += pr.some((v, j) => v !== sums[j])
            ? ` The printed ${ex.total.label} says ${tList(pr.map(String))}: each row is rounded, so the sum can be a little off.`
            : ` That matches the printed ${ex.total.label}.`;
        }
      } else if (r) {
        msg = `${c.label} = ${r[0].label} ÷ ${r[1].label}, row by row. All rows together: ${tList(periods.map((p) => {
          const a = tTotal(p, r[0]);
          const b = tTotal(p, r[1]);
          return `${a} ÷ ${b} ≈ ${b ? Math.round((a / b) * 100) : "–"}%${many ? ` in ${p}` : ""}`;
        }))}, not the average of the rows' rates.`;
      } else {
        msg = "Printed as a rate for each row; there are no columns here to re-compute it from.";
      }
      read.appendChild(el("p", { class: "ex-check" }, msg));
      return;
    }

    const isTot = mode === "tot";
    const valueOf = isTot ? tTotal : (p, c) => tV(p, c.key, st.sel);
    vals.appendChild(el("b", {}, isTot ? totName() : cats[st.sel]));
    cols.forEach((c) => {
      vals.appendChild(el("span", {}, `${c.label} ${periods.map((p) => tFmt(c, valueOf(p, c))).join(" → ")}`));
    });
    read.appendChild(vals);

    cols.forEach((c) => {
      const r = tRatio(c);
      let off = false;
      const parts = [];
      if (!r) return;
      periods.forEach((p) => {
        const a = valueOf(p, r[0]);
        const b = valueOf(p, r[1]);
        const v = valueOf(p, c);
        if (a == null || !b) return;
        const x = Math.round((a / b) * 100);
        if (x !== v) off = true;
        parts.push(`${periods.length > 1 ? `${p} ` : ""}${a} ÷ ${b} ≈ ${x}%`);
      });
      if (parts.length) {
        read.appendChild(el("p", { class: "ex-check" }, `Check: ${parts.join(", ")}.${off ? " The labels are rounded, so a printed rate can differ a little." : ""}`));
      }
    });

    if (isTot) {
      const diffs = [];
      if (ex.total) {
        cols.forEach((c) => {
          if (c.unit === "%") return;
          periods.forEach((p) => {
            const sm = sumValues(ex.values[p][c.key]);
            const t = ex.total.values[p][c.key];
            if (sm !== t) diffs.push(`${periods.length > 1 ? `${p} ` : ""}${c.label}: the rows add up to ${sm}, not ${t}`);
          });
        });
      }
      read.appendChild(
        el(
          "p",
          { class: "ex-check" },
          !ex.total
            ? "We added the rows; the rate comes from the summed columns, not from averaging the rows' rates."
            : diffs.length
              ? `${diffs.join("; ")}. Each row is rounded, so a printed total can be a little off.`
              : "The rows add up to the printed totals."
        )
      );
    }

    if (st.change && periods.length > 1) {
      const p0 = periods[0];
      const p1 = periods[periods.length - 1];
      read.appendChild(
        el(
          "p",
          { class: "ex-check ex-read-chg" },
          `Change, ${p0} to ${p1} (our arithmetic): ${cols.map((c) => {
            const x = valueOf(p0, c);
            const y = valueOf(p1, c);
            if (x == null || y == null) return `${c.label} –`;
            return `${c.label} ${tDelta(c, x, y)}${c.unit !== "%" && x > 0 ? ` (${tSigned(Math.round(((y - x) / x) * 100))}%)` : ""}`;
          }).join(", ")}.`
        )
      );
    }
  }

  // C-014c waterfalls
  const wf = isFall
    ? (() => {
        let run = 0;
        const out = [];
        steps.forEach((x, i) => {
          if (x.kind === "total") {
            out.push({ i, total: true, top: x.value, bottom: 0, before: run, after: x.value, sum: run });
            run = x.value;
          } else {
            const a = run;
            const b = run + x.value;
            out.push({ i, total: false, top: Math.max(a, b), bottom: Math.min(a, b), before: a, after: b, down: x.value < 0 });
            run = b;
          }
        });
        return out;
      })()
    : [];

  const wNum = (v) => String(Math.round(v * 10) / 10);
  const wAria = (i) => {
    const r = wf[i];
    return `${cats[i]}: ${r.total ? `${steps[i].value} ${ex.unit}` : `${r.down ? "minus " : "plus "}${Math.abs(steps[i].value)} ${ex.unit}, from ${wNum(r.before)} to ${wNum(r.after)}`}`;
  };

  function setLeft(on) {
    st.left = Boolean(on);
    if (vLeft) vLeft.setAttribute("aria-pressed", String(st.left));
    fig.classList.toggle("is-left", st.left);
  }

  function fallPads() {
    return [Math.ceil(textWidth(ex.unit, measureFont(14, 500, true, fig))) + 12, 8];
  }

  function fallLines(w) {
    const pd = fallPads();
    const cw = (w - pd[0] - pd[1]) / n;
    const font = measureFont(14, 400, false, fig);
    const out = [];
    if (cw < 56) return null;
    for (let i = 0; i < n; i++) {
      const ls = wrapLabel(cats[i], cw - 6, font);
      if (!ls || ls.length > 3) return null;
      out.push(ls);
    }
    return out;
  }

  function drawFallColumns(w, lines) {
    const pd = fallPads();
    const padL = pd[0];
    const padR = pd[1];
    const top = 30;
    const ph = 220;
    const base = top + ph;
    const nl = Math.max(...lines.map((x) => x.length));
    const hgt = base + 14 + nl * 18 + 4;
    const cw = (w - padL - padR) / n;
    const bw = Math.min(cw * 0.62, 66);
    const bAx = ex.axes && ex.axes.bar;
    const max = bAx ? bAx[1] : Math.max(...wf.map((r) => r.top)) * 1.08;
    const y = (v) => base - (v / max) * ph;

    const s = svgEl("svg", {
      class: "ex-svg ex-fall",
      width: w,
      height: hgt,
      viewBox: `0 0 ${w} ${hgt}`,
      role: "group",
      "aria-label": `${ex.number}. Tap a step to read it, or switch to Table.`
    });
    s.appendChild(svgEl("line", { class: "ex-axis", x1: padL, x2: w - padR, y1: base + 0.5, y2: base + 0.5 }));

    wf.forEach((r, i) => {
      if (i === n - 1) return;
      const yy = y(r.after).toFixed(1);
      s.appendChild(svgEl("line", {
        class: "ex-conn",
        x1: (padL + cw * i + (cw + bw) / 2).toFixed(1),
        x2: (padL + cw * (i + 1) + (cw - bw) / 2).toFixed(1),
        y1: yy,
        y2: yy,
        style: `--i:${i}`
      }));
    });

    const labs = svgEl("g", { class: "ex-xlabs", "data-part": "key", id: pid("key") });
    wf.forEach((r, i) => {
      const cx = padL + cw * (i + 0.5);
      const yt = y(r.top);
      const yb = y(r.bottom);
      const h = Math.max(yb - yt, 1);
      const inside = h >= 22;
      const g = svgEl("g", { class: "ex-col ex-wcol", "data-i": i, id: pid(slugs[i]), style: `--i:${i}` });
      g.appendChild(svgEl("rect", {
        class: "ex-colbg",
        x: (padL + cw * i + 3).toFixed(1),
        y: top - 26,
        width: (cw - 6).toFixed(1),
        height: ph + 29,
        rx: 6
      }));
      g.appendChild(svgEl("rect", {
        class: `ex-wbar ${r.total ? "is-total" : r.down ? "is-down" : "is-up"}`,
        x: (cx - bw / 2).toFixed(1),
        y: yt.toFixed(1),
        width: bw.toFixed(1),
        height: h.toFixed(1)
      }));
      g.appendChild(svgEl("text", {
        class: `ex-val ex-wval${inside ? " is-in" : ""}${r.total ? " is-total" : ""}`,
        x: cx.toFixed(1),
        y: (inside ? yt + h / 2 + 5 : yt - 7).toFixed(1),
        "text-anchor": "middle"
      }, String(Math.abs(steps[i].value))));
      if (!r.total) {
        g.appendChild(svgEl("text", { class: "ex-left", x: cx.toFixed(1), y: (yb + 17).toFixed(1), "text-anchor": "middle" }, wNum(r.after)));
      }
      const label = svgEl("text", { class: "ex-catlab", x: cx.toFixed(1), y: base + 22, "text-anchor": "middle" });
      lines[i].forEach((ln, j) => {
        label.appendChild(svgEl("tspan", { x: cx.toFixed(1), dy: j ? 18 : 0 }, ln));
      });
      labs.appendChild(label);

      const hit = svgEl("rect", {
        class: "ex-hit",
        x: (padL + cw * i).toFixed(1),
        y: 0,
        width: cw.toFixed(1),
        height: hgt,
        role: "button",
        "aria-pressed": "false",
        "aria-label": wAria(i),
        tabindex: (st.sel == null ? i === 0 : i === st.sel) ? "0" : "-1"
      });
      hit.addEventListener("click", () => pick(i));
      hit.addEventListener("keydown", (e) => keys(e, i, s));
      hit.addEventListener("focus", () => g.classList.add("is-focus"));
      hit.addEventListener("blur", () => g.classList.remove("is-focus"));
      g.appendChild(hit);
      s.appendChild(g);
    });

    add(s, labs, svgEl("text", { class: "ex-unit", x: 2, y: 15 }, ex.unit));
    plot.appendChild(s);
  }

  function drawFallRows() {
    const box = el("div", { class: "ex-rows ex-wrows", role: "group", "aria-label": `${ex.number}. Tap a step to read it.` });
    const headRow = el("div", { class: "ex-rows-head", "aria-hidden": "true" });
    add(headRow, el("span", {}, ""), el("span", { class: "ex-unit" }, ex.unit), el("span", {}, ""));
    box.appendChild(headRow);

    const max = Math.max(...wf.map((r) => r.top)) || 1;
    wf.forEach((r, i) => {
      const b = el("button", {
        class: "ex-row ex-wrow",
        type: "button",
        "data-i": i,
        id: pid(slugs[i]),
        "aria-pressed": "false",
        "aria-label": wAria(i),
        style: `--i:${i}`
      });
      const tr = el("span", { class: "ex-wtrack" });
      const seg = el("span", { class: `ex-wseg ${r.total ? "is-total" : r.down ? "is-down" : "is-up"}` });
      seg.style.setProperty("--a", (r.bottom / max).toFixed(4));
      seg.style.setProperty("--b", (r.top / max).toFixed(4));
      tr.appendChild(seg);
      const val = el("span", { class: "ex-wv" }, String(Math.abs(steps[i].value)));
      if (!r.total) val.appendChild(el("span", { class: "ex-left" }, `→ ${wNum(r.after)}`));
      add(b, el("span", { class: "ex-row-name", "data-part": "key", "data-ev": "key" }, cats[i]), tr, val);
      b.addEventListener("click", () => pick(i));
      box.appendChild(b);
    });
    plot.appendChild(box);
  }

  function drawFallTable() {
    const t = el("table", { class: "changes ex-table ex-wtable" });
    const th = el("thead");
    const hr = el("tr");
    const tb = el("tbody");
    t.appendChild(el("caption", {}, `${ex.number}: ${ex.title} (${ex.units})`));
    const hu = el("th", { scope: "col" });
    add(hu, el("span", { class: "ex-u" }, ex.unit), document.createTextNode(", as printed"));
    add(hr, el("th", { scope: "col" }, ""), hu, el("th", { scope: "col", class: "ex-ours" }, "Left after it (our sum)"));
    th.appendChild(hr);
    t.appendChild(th);

    wf.forEach((r, i) => {
      const tr = el("tr", { "data-i": i, id: pid(slugs[i]) });
      const rh = el("th", { scope: "row", "data-part": "key", "data-ev": "key" });
      const b = el("button", { class: "ex-cat", type: "button", "aria-pressed": "false" }, cats[i]);
      b.addEventListener("click", () => pick(i));
      rh.appendChild(b);
      add(tr, rh, el("td", {}, String(Math.abs(steps[i].value))), el("td", { class: "ex-ours" }, wNum(r.total ? (i ? r.sum : steps[i].value) : r.after)));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    plot.appendChild(t);
  }

  function fallRead(i) {
    read.innerHTML = "";
    if (i == null) {
      read.appendChild(el("p", { class: "ex-read-hint" }, st.layout === "table" ? "Tap a name to pick its step." : "Tap a step to read it."));
      return;
    }
    const r = wf[i];
    const x = steps[i];
    const u = ex.unit;
    const vals = el("p", { class: "ex-read-vals" });
    let msg = null;
    vals.appendChild(el("b", {}, cats[i]));
    if (r.total) {
      vals.appendChild(el("span", {}, `${x.value} ${u}`));
    } else {
      add(vals, el("span", {}, `${r.down ? "−" : "+"}${Math.abs(x.value)} ${u}`), el("span", {}, `${wNum(r.before)} → ${wNum(r.after)} ${u} (our sums)`));
    }
    read.appendChild(vals);
    if (!r.total) {
      msg = r.before > 0 ? `That is about ${Math.round((Math.abs(x.value) / r.before) * 100)}% of the ${wNum(r.before)} ${u} left before it.` : null;
    } else if (i === 0) {
      msg = "Where the walk starts: every step after it changes this total.";
    } else {
      let j = i - 1;
      while (j > 0 && !wf[j].total) j--;
      const terms = [String(steps[j].value)];
      for (let k = j + 1; k < i; k++) {
        terms.push((steps[k].value < 0 ? "− " : "+ ") + Math.abs(steps[k].value));
      }
      msg = `Check: ${terms.join(" ")} = ${wNum(r.sum)}${r.sum === x.value ? "." : `. The labels are rounded, so the printed ${x.value} can differ a little.`}${steps[0].value > 0 ? ` ${x.value} is about ${Math.round((x.value / steps[0].value) * 100)}% of the ${steps[0].value} ${u} at the start.` : ""}`;

      add(li, el("strong", {}, h.id), dashBadge(h.status, "muted"), el("p", {}, h.statement));
      ul.appendChild(li);
    });
    hCard.appendChild(ul);
    rightCol.appendChild(hCard);

    const decCard = el("section", { class: "dash-card" });
    add(
      decCard,
      el("h3", { class: "dash-card-title" }, "17 Required Scientific Decisions (Strict Null Guard)"),
      el("p", { class: "dash-card-sub" }, "0 / 17 confirmed; missing choices render explicitly as — and hard-block G3")
    );
    const decDetails = el("details", { class: "dash-details", open: "" });
    decDetails.appendChild(el("summary", {}, `Inspect all ${(ov.decisions || []).length} G3 blocking fields`));
    decDetails.appendChild(
      makeTable(
        [
          { label: "Key" },
          { label: "Parameter" },
          { label: "Stage" },
          { label: "Value", numeric: true },
          { label: "Missing Reason" }
        ],
        (ov.decisions || []).map((d) => [el("code", {}, d.key), d.label, d.group, d.value, d.reason]),
        "Required Decisions Table"
      )
    );
    decCard.appendChild(decDetails);
    rightCol.appendChild(decCard);

    add(grid, leftCol, rightCol);
    host.appendChild(grid);

    if (DATA.timeline) {
      host.appendChild(
        RTR.createTimeline(DATA.timeline, {
          factorLabel: "Protocol & Topic Progression",
          replayLabel: "Replay",
          ariaLabel: "Protocol and topic progression timeline"
        })
      );
    }
  })();

  /* Tab 2: Synthetic Route Audits & Exhibits */
  (function renderRoutes() {
    const host = document.getElementById("mount-routes");
    const rt = DATA.routes || {};

    host.appendChild(
      RTR.createSectionHeader({
        step: "02",
        shelfMark: { code: "C2", label: "Synthetic Audits" },
        family: "company",
        meta: "Synthetic Multi-Series vs. Broad Panel Audit · E-DEMO-20261124",
        title: "Interactive Pre-Freeze Data Eligibility & Route Feasibility Exhibits",
        points: [
          ["Synthetic Routes", "Contrasts high-series medicinal chemistry sets against sparse single-ligand broad screens"],
          ["Eligibility Hygiene", "Separates 16.5% inequality-censored measurements from exact singleton points before splitting"],
          ["Power Safeguard", "Demonstrates automatic underpowered_series_count flagging below 6 independent series"]
        ]
      })
    );

    if (Array.isArray(rt.exhibits) && rt.exhibits.length) {
      routeExGroup = RTR.createExhibitGroup(rt.exhibits, {
        idPrefix: "dash",
        bandLabel: "Synthetic audit redraw · labels as defined",
        institution: "LabGate Demo Fixtures",
        metaText: "2026-11-24 · label-blind"
      });
      host.appendChild(routeExGroup);
    }

    const bottomGrid = el("div", { class: "dash-grid-2" });
    if (rt.state_sheet) {
      bottomGrid.appendChild(RTR.createSourceSheet(rt.state_sheet, { idPrefix: "state-doc" }));
    }

    const synthCard = el("section", { class: "dash-card" });
    add(
      synthCard,
      el("h3", { class: "dash-card-title" }, "Synthetic Evaluation Controls (Positive, Null & Underpowered)"),
      el("p", { class: "dash-card-sub" }, "Source: demo_data/demo_synthetic_eval.json · formal_use_allowed = false")
    );
    synthCard.appendChild(
      makeTable(
        [
          { label: "Control Scenario" },
          { label: "Series", numeric: true },
          { label: "Compounds", numeric: true },
          { label: "Δ Gain", numeric: true },
          { label: "95% Bootstrap CI" },
          { label: "Harmed Series" },
          { label: "Diagnostics" }
        ],
        (rt.synthetic_controls || []).map((c) => [
          c.name,
          c.groups,
          c.compounds,
          c.delta_gain,
          c.ci95,
          dashBadge(c.harmed, c.kind),
          c.warnings || "—"
        ]),
        "Synthetic Controls Table"
      )
    );
    bottomGrid.appendChild(synthCard);
    host.appendChild(bottomGrid);
  })();

  /* Tab 3: Literature Shelf + Native <dialog> */
  (function renderLiterature() {
    const host = document.getElementById("mount-literature");
    const lit = DATA.literature || {};
    const papers = lit.papers || [];
    const concepts = lit.concepts || [];
    const resultsByPaper = lit.results_by_paper || {};

    host.appendChild(
      RTR.createSectionHeader({
        step: "03",
        shelfMark: { code: "M2", label: "Literature Lineage" },
        meta: `Read-only SQLite (?mode=ro&immutable=1) · ${papers.length} Verified Cards / ${lit.total_results || 0} Rows`,
        title: "Immutable Literature Card Index & Topic Lineage Filter",
        points: [
          ["Card Integrity", `${papers.length} / ${papers.length} verified cards SHA-256 matched against 论文内容索引/literature.db`],
          ["Topic Tracing", `Linked to ${(lit.core_ids || []).length} comparison entries in demo_compare.tsv`],
          ["Glossary Integration", `${Object.keys(DATA.glossary || {}).length} interactive domain definitions attached`]
        ]
      })
    );

    const controlCard = el("section", { class: "dash-card dash-filter-bar" });
    const searchRow = el("div", { class: "dash-filter-row" });
    const searchInput = el("input", {
      type: "search",
      id: "lit-search",
      class: "dash-search-input",
      placeholder: "Filter by ID, title, author, year, or conclusion (e.g. L101, censoring, negative)...",
      "aria-label": "Filter verified literature cards"
    });
    const scopeBtns = [];
    const scopes = [
      ["all", `All (${papers.length})`],
      ["core", `Linked to Topic (${(lit.core_ids || []).length})`],
      ["quant", "Has Quant Rows"]
    ];
    const scopeGroup = el("div", { class: "dash-pill-group", role: "group", "aria-label": "Literature scope filter" });
    let activeScope = "all";
    let activeConcept = "ALL";

    scopes.forEach(([key, lbl]) => {
      const btn = el("button", {
        type: "button",
        class: "dash-pill-btn",
        "data-lit-scope": key,
        "aria-pressed": String(key === "all")
      }, lbl);
      btn.addEventListener("click", () => {
        activeScope = key;
        scopeBtns.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        applyFilter();
      });
      scopeBtns.push(btn);
      scopeGroup.appendChild(btn);
    });
    add(searchRow, searchInput, scopeGroup);
    controlCard.appendChild(searchRow);

    const conceptWrap = el("div", { class: "dash-chip-wrap", role: "group", "aria-label": "Concept filters" });
    const cBtns = [];
    const allChip = el("button", { type: "button", class: "dash-chip", "data-concept": "ALL", "aria-pressed": "true" }, `All Concepts (${papers.length})`);
    allChip.addEventListener("click", () => {
      activeConcept = "ALL";
      cBtns.forEach((b) => b.setAttribute("aria-pressed", String(b === allChip)));
      applyFilter();
    });
    cBtns.push(allChip);
    conceptWrap.appendChild(allChip);

    concepts.forEach((c) => {
      const chip = el("button", { type: "button", class: "dash-chip", "data-concept": c.id, "aria-pressed": "false", title: c.en_name }, `${c.id} ${c.en_name} (${c.count})`);
      chip.addEventListener("click", () => {
        activeConcept = activeConcept === c.id ? "ALL" : c.id;
        cBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.getAttribute("data-concept") === activeConcept)));
        applyFilter();
      });
      cBtns.push(chip);
      conceptWrap.appendChild(chip);
    });
    controlCard.appendChild(conceptWrap);

    const countStatus = el("div", { class: "rtr-muted", style: "font-size:0.875rem", id: "lit-match-count", "aria-live": "polite" });
    controlCard.appendChild(countStatus);
    host.appendChild(controlCard);

    const tableCard = el("section", { class: "dash-card" });
    const tableMount = el("div", { id: "lit-table-mount" });
    tableCard.appendChild(tableMount);
    host.appendChild(tableCard);

    const dialog = document.getElementById("paper-dialog");
    const dialogTitle = document.getElementById("paper-dialog-title");
    const dialogBody = document.getElementById("paper-dialog-body");
    document.getElementById("paper-dialog-close").addEventListener("click", () => dialog.close());
    if (!("closedBy" in HTMLDialogElement.prototype)) {
      dialog.addEventListener("click", (e) => {
        const rect = dialog.getBoundingClientRect();
        const inside = rect.top <= e.clientY && e.clientY <= rect.top + rect.height && rect.left <= e.clientX && e.clientX <= rect.left + rect.width;
        if (!inside) dialog.close();
      });
    }

    function openPaperModal(p) {
      dialogTitle.textContent = `${p.paper_id} · ${p.title}`;
      dialogBody.innerHTML = "";
      const tagStrip = el("div", { style: "display:flex;flex-wrap:wrap;gap:0.4rem" });
      add(
        tagStrip,
        dashBadge(`${p.year || "—"} · ${p.priority || "—"}`, "accent"),
        dashBadge(p.ledger_topic || "—", "muted"),
        p.is_core ? dashBadge("Linked to Topic", "pass") : null,
        dashBadge(`Quant Rows: ${p.result_count}`, "muted")
      );
      dialogBody.appendChild(tagStrip);

      dialogBody.appendChild(
        RTR.createSourceSheet({
          id: "modal-" + p.paper_id,
          variant: p.is_core ? "company" : "official",
          srcLabel: "Synthetic Verified Card · Scope & Quantitative Bounds",
          band: [p.paper_id, p.review_status],
          title: p.title,
          meta: p.doi || p.venue_or_status,
          sentences: [
            { id: "S1", text: `Authors & Venue: ${p.authors || "—"} (${p.venue_or_status || "—"}), Card ${p.card_path}.` },
            { id: "S2", text: `Scope Summary: ${p.retrieval_abstract || "—"}` },
            { id: "S3", text: `Establishes: ${p.project_use_summary || "—"}` }
          ]
        })
      );

      if (p.negative_results_summary) {
        const neg = el("div", { class: "dash-callout is-warn" });
        add(neg, el("strong", {}, "Does Not Establish / Negative Scope"), el("div", {}, p.negative_results_summary));
        dialogBody.appendChild(neg);
      }

      const rRows = resultsByPaper[p.paper_id] || [];
      dialogBody.appendChild(el("h4", { style: "margin:0.25rem 0 0;font-family:var(--font-serif)" }, `Verified Quantitative Rows (${rRows.length})`));
      if (rRows.length) {
        dialogBody.appendChild(
          makeTable(
            [
              { label: "Result ID" },
              { label: "Task & Sample" },
              { label: "Split & Condition" },
              { label: "Metric" },
              { label: "Value", numeric: true },
              { label: "Comparator" },
              { label: "Locator" },
              { label: "Verification" }
            ],
            rRows.map((r) => [
              el("code", {}, r.result_id),
              `${r.task} | ${r.sample}`,
              `${r.split} | ${r.condition}`,
              r.metric,
              `${r.value} (${r.uncertainty})`,
              r.comparator,
              r.locator,
              dashBadge(r.check_status, r.check_status === "visual_verified" ? "pass" : "accent")
            ]),
            `${p.paper_id} Quantitative Results`
          )
        );
      }
      dialog.showModal();
    }

    function applyFilter() {
      const q = (searchInput.value || "").trim().toLowerCase();
      const filtered = papers.filter((p) => {
        if (activeScope === "core" && !p.is_core) return false;
        if (activeScope === "quant" && !(p.result_count > 0)) return false;
        if (activeConcept !== "ALL" && !(p.concepts || []).includes(activeConcept)) return false;
        if (q) {
          const hay = [p.paper_id, p.title, p.authors, p.year, p.retrieval_abstract, p.negative_results_summary].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      countStatus.textContent = `Showing ${filtered.length} / ${papers.length} verified synthetic cards`;
      tableMount.innerHTML = "";
      tableMount.appendChild(
        makeTable(
          [
            { label: "ID" },
            { label: "Year", numeric: true },
            { label: "Priority" },
            { label: "Title & Venue" },
            { label: "Tags" },
            { label: "Rows", numeric: true },
            { label: "Action" }
          ],
          filtered.map((p) => {
            const titleCell = el("div");
            const btn = el("button", { type: "button", class: "dash-lit-title-btn", "data-paper-open": p.paper_id }, p.title);
            btn.addEventListener("click", () => openPaperModal(p));
            add(titleCell, btn, el("div", { class: "dash-lit-sub" }, `${p.authors} · ${p.venue_or_status}`));

            const flags = el("div", { style: "display:flex;flex-wrap:wrap;gap:0.25rem" });
            if (p.is_core) flags.appendChild(dashBadge("Topic Linked", "pass"));
            (p.concepts || []).forEach((cid) => flags.appendChild(dashBadge(cid, "muted")));

            const openBtn = el("button", { type: "button", class: "rtr-btn-ghost", style: "padding:0.25rem 0.6rem;font-size:0.875rem" }, "Inspect");
            openBtn.addEventListener("click", () => openPaperModal(p));

            return [el("code", {}, p.paper_id), String(p.year), dashBadge(p.priority, p.priority === "P0" ? "accent" : "muted"), titleCell, flags, String(p.result_count), openBtn];
          }),
          "Verified Literature Index"
        )
      );
    }

    searchInput.addEventListener("input", applyFilter);
    applyFilter();
  })();

  /* Tab 4: Weekly Carryover Reports */
  (function renderReports() {
    const host = document.getElementById("mount-reports");
    const weeks = DATA.weekly_reports || [];

    host.appendChild(
      RTR.createSectionHeader({
        step: "04",
        shelfMark: { code: "M3", label: "Weekly Ledger" },
        meta: "W47 – W48 Carryover Reconciliation · SHA-256 Parent-Linked",
        title: "Carryover-Verified Weekly Progress & Fourfold Feasibility Guards",
        points: [
          ["Parent Locking", "W48 automatically inherits and locks W47 planned items via parent_ref SHA-256"],
          ["Feasibility Guards", "Rejects window mismatches, missing fallbacks, capacity overloads, or formal runs before G3"],
          ["Zero Jargon Leak", "Prose linter blocks script names, gate IDs, and database tokens from human narrative"]
        ]
      })
    );

    const switchBar = el("div", { class: "dash-pill-group", role: "group", "aria-label": "Select week" });
    const weekMount = el("div", { style: "display:flex;flex-direction:column;gap:1.1rem" });
    const wBtns = [];

    function selectWeek(wk) {
      wBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.getAttribute("data-week") === wk.week_id)));
      weekMount.innerHTML = "";
      const tr = (wk.tracks && wk.tracks[0]) || {};
      const sentences = [
        { id: "W1", text: `Summary: ${wk.one_line_summary || "—"}` },
        { id: "W2", text: `Carryover: ${wk.header_note || "—"}` }
      ];
      if (tr.completion_summary) sentences.push({ id: "W3", text: `Completion (${tr.completion_status}): ${tr.completion_summary}` });
      (tr.progress_points || []).forEach((pt, idx) => sentences.push({ id: `P${idx + 1}`, text: pt.replace(/\*\*/g, "") }));

      weekMount.appendChild(
        RTR.createSourceSheet({
          id: "week-" + wk.week_id,
          variant: "official",
          srcLabel: `weekly-record.v1 · ${wk.week_id}`,
          band: [wk.week_id, wk.bundle_dir],
          entity: wk.week_id,
          entityMeta: tr.title || "Researcher",
          dateline: wk.period,
          sentences,
          side: [
            ["Window", wk.period || "—"],
            ["As Of", wk.as_of_date || "—"],
            ["Parent", wk.parent_week || "—"],
            ["Status", tr.status_level || "—"]
          ],
          footer: `Self-contained bundle: ${wk.bundle_dir}`
        })
      );

      if (Array.isArray(tr.next_week_plan) && tr.next_week_plan.length) {
        const planCard = el("section", { class: "dash-card" });
        add(
          planCard,
          el("h3", { class: "dash-card-title" }, `${wk.week_id} Next-Week Commitments (Fourfold Guard Checked)`),
          makeTable(
            [{ label: "Task" }, { label: "Commitment" }, { label: "Due" }, { label: "Objective & Criterion" }, { label: "Fallback / Trigger" }],
            tr.next_week_plan.map((t) => [
              el("code", {}, t.task_id),
              dashBadge(t.commitment, t.commitment === "committed" ? "pass" : "accent"),
              t.due_date,
              `${t.summary} (${t.deliverable_or_criterion})`,
              t.if_blocked_fallback || t.trigger_condition || "Self-contained"
            ]),
            `${wk.week_id} Plan`
          )
        );
        weekMount.appendChild(planCard);
      }
    }

    weeks.forEach((wk, idx) => {
      const btn = el("button", { type: "button", class: "dash-pill-btn", "data-week": wk.week_id, "aria-pressed": String(idx === 0) }, wk.week_id);
      btn.addEventListener("click", () => selectWeek(wk));
      wBtns.push(btn);
      switchBar.appendChild(btn);
    });

    host.appendChild(switchBar);
    host.appendChild(weekMount);
    if (weeks.length) selectWeek(weeks[0]);
  })();

  RTR.attachGlossary(document, DATA.glossary || {});
  RTR.initMotion(document);
  RTR.initReadingProgress();
})();

</script>
</body>
</html>
